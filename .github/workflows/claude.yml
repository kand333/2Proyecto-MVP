# Mention @claude in an issue or PR to run Claude Code here.
#   @claude /spect-creator-inicio <brief>   -> writes the contract in docs/
#   @claude /spect-creator-inicio next      -> implements the next task of docs/task.md
# Requires: Claude GitHub App installed on the repo + secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    # Same database layout as docker-compose.yml: `app` for dev, `app_test` for integration tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # setup first: `npm ci` runs `prisma generate`, which reads the env files.
      - run: npm run setup
      - run: npm ci
      - run: PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE app_test"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action already allows git add/commit/push and file edits; these are the project commands.
          claude_args: |
            --append-system-prompt "This repository wants pull requests opened automatically: after pushing your branch, run gh pr create --base main yourself (see the 'En GitHub Actions' section of the spect-creator-inicio skill). Never merge or push to main."
            --allowedTools "WebFetch(domain:raw.githubusercontent.com),Bash(npm test *),Bash(npm run test *),Bash(npm run lint *),Bash(npm run typecheck *),Bash(npm run build *),Bash(npm run db:migrate *),Bash(npm run db:generate *),Bash(npm run db:seed *),Bash(npx vitest *),Bash(node .claude/skills/spect-creator-inicio/scripts/*),Bash(node --test *),Bash(git status *),Bash(git diff *),Bash(git log *),Bash(gh pr create *)"
