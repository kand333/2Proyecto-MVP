# Local PostgreSQL for development and tests. Not for production.
# No fixed project `name:`: Compose uses the folder name, so every project made from the starter
# gets its own container and volume. Port 5433 avoids clashing with another local PostgreSQL on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      # Reachable only from this machine.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is created: adds the test database.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
